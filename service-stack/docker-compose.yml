# Stack di servizi indipendente da Project NOMAD — Kiwix + Ollama.
#
# Sostituisce il piano precedente ("Ubuntu+Docker+Project NOMAD" descritto
# in docs/deployment.md fino al 30 settembre 2026), che richiedeva il
# sorgente Docker di Project NOMAD (mai reso disponibile, progetto esterno
# "non dichiarato stabile", spec §4). `gateway/nomad/kiwix-gateway.ts` e
# `gateway/nomad/ai-gateway.ts` parlano già con le vere API di kiwix-serve
# e Ollama (docs/security.md voce #97) — non con un'API NOMAD — quindi
# qualunque istanza di questi due programmi, comunque avviata, funziona.
# Questo file la avvia con due immagini Docker ufficiali e pubbliche,
# indipendenti da Project NOMAD: nessun sorgente esterno da procurarsi.
#
# Flatnotes deliberatamente NON incluso qui (decisione esplicita
# dell'utente, 30 settembre 2026): la sua API è verificata solo su carta,
# `FlatnotesGateway` va prima riscritto con lo stesso trattamento già dato
# a Kiwix/Ollama (docs/next-steps.md) — va aggiunto a questo file in quel
# momento, non prima.
#
# Non verificato in questo ambiente: nessun demone Docker raggiungibile
# in questa sessione (`docker info` fallisce, "no such file or
# directory" sul socket) — sintassi/porte/volumi verificati contro la
# documentazione ufficiale di ciascun progetto (vedi service-stack/README.md
# per le fonti), mai un `docker compose up` reale. Popolare `./data/zim/`
# con file ZIM reali e scaricare modelli Ollama (`ollama pull ...`) resta
# lavoro dell'operatore — bring-up fisico, mai un passo di questo file
# (CLAUDE.md, "Priorità per chi riprende questo lavoro").

services:
  kiwix-serve:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: arald-kiwix-serve
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/zim:/data:ro
    # '*.zim' fa servire a kiwix-serve ogni file ZIM presente in ./data/zim,
    # un "libro" per file (il nome usato da --kiwix-book di gateway/nomad/cli.ts
    # è quello che kiwix-serve deriva dal file — verificare con l'endpoint
    # /search o i log del container quale nome esatto usare).
    command: ["*.zim"]

  ollama:
    image: ollama/ollama:latest
    container_name: arald-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # Nessun modello incluso nell'immagine: dopo l'avvio, un operatore deve
    # scaricarne uno (`docker exec arald-ollama ollama pull <modello>`,
    # coerente con --ai-model di gateway/nomad/cli.ts, default "llama3.2")
    # prima che service://ai risponda con qualcosa di reale.
