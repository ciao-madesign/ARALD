<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="arald-data-base" content="/strumento-rete/data/">
<meta name="arald-tiles" content="off">
<title>ARALD Network Design Tool</title>
<style>
/* Layout: mappa a sinistra che occupa tutto lo spazio, pannello a destra (sotto la mappa su schermi stretti). */
:root {
  --bg: #eff2f6; --surface: #ffffff; --surface-2: #e6ebf2; --fg: #18202e; --muted: #596579; --line: #d0d7e2;
  --accent: #2b47c9; --accent-fg: #ffffff;
  --good: #1c8f4d; --warn: #c98200; --bad: #cc3b3b;
  --land-sea: #b9d0e4; --land-open: #e4e2d0; --land-forest: #bdd1ae; --land-urban: #d6d1c9; --land-urban-dense: #bab3a9; --land-high: #eef0f4; --nodata: #cdd3dc;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --surface: #171f2d; --surface-2: #1f293a; --fg: #e5eaf3; --muted: #95a2b8; --line: #2b3548;
    --accent: #8fa4ff; --accent-fg: #0f1520; --good: #4cc27d; --warn: #e3a62f; --bad: #ee6b6b;
    --land-sea: #18283a; --land-open: #2b2c25; --land-forest: #233221; --land-urban: #353330; --land-urban-dense: #4a4640; --land-high: #7b8499; --nodata: #202838;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #171f2d; --surface-2: #1f293a; --fg: #e5eaf3; --muted: #95a2b8; --line: #2b3548;
  --accent: #8fa4ff; --accent-fg: #0f1520; --good: #4cc27d; --warn: #e3a62f; --bad: #ee6b6b;
  --land-sea: #18283a; --land-open: #2b2c25; --land-forest: #233221; --land-urban: #353330; --land-urban-dense: #4a4640; --land-high: #7b8499; --nodata: #202838;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); padding-inline: 16px; padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
h3 { font-size: 12px; font-weight: 600; margin: 4px 0 0; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.mono { font-family: var(--font-mono); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.error { color: var(--bad); margin: 0; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top .grow { flex: 1 1 0; min-width: 0; }
.demo { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; background: var(--surface); }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
select, input[type="text"], input[type="number"], textarea, .btn {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-height: 30px;
}
select { max-width: 100%; }
textarea { width: 100%; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }
.pal { display: inline-flex; align-items: center; gap: 6px; cursor: grab; }
.pal svg { width: 14px; height: 14px; flex: none; }
.pal svg * { fill: var(--surface); stroke: currentColor; stroke-width: 2; }
.pal[aria-pressed="true"] svg * { fill: var(--accent-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 12px var(--font-mono); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.wp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.wp td, .wp th { padding: 3px 4px 3px 0; text-align: left; font-weight: 400; }
.wp input { width: 64px; min-height: 26px; padding: 2px 6px; }
.row-end { margin-left: auto; }
.btn.small-btn { padding: 2px 8px; min-height: 24px; font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.work { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 10px; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; } #map-wrap { flex: none; height: 62vh; min-height: 320px; } html, body { height: auto; } }
.mapcol { min-width: 0; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.group > .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-right: 2px; }
#map-wrap { position: relative; flex: 1 1 auto; min-height: 320px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--land-sea); }
#map { display: block; touch-action: none; }
#status-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#status, #cursor-info { font-size: 12.5px; color: var(--muted); min-height: 18px; }
#cursor-info { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
#attribution { position: absolute; right: 0; bottom: 0; max-width: 72%; padding: 2px 8px; font-size: 10.5px; line-height: 1.35; color: var(--muted); background: color-mix(in srgb, var(--surface) 86%, transparent); border-top-left-radius: 5px; pointer-events: auto; }
#tile-state { position: absolute; left: 8px; bottom: 8px; max-width: 70%; padding: 4px 10px 4px 10px; font-size: 12px; color: var(--fg); background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 5px; }
#tile-state.err { border-color: var(--bad); color: var(--bad); }
#tile-state.busy::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; vertical-align: -1px; }
@media (prefers-reduced-motion: no-preference) { #tile-state.busy::before { animation: spin 0.9s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
#goto-msg:empty { display: none; }
#notice { font-size: 12.5px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 5px; padding: 6px 10px; }
.ground { margin: 0; font-size: 12.5px; }
.warn-note { margin: 0; font-size: 12.5px; color: var(--warn); }

.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; font: inherit; font-weight: 500; padding: 9px 8px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
#panel-body { padding: 12px; overflow: auto; min-height: 0; flex: 1 1 auto; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input { width: 100%; }
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 6px 3px 0; white-space: nowrap; }
.tbl td { padding: 4px 6px 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
.q { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.q::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--qc); }
.qbar { height: 10px; border-radius: 3px; }
.qbar-l { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.swatch { display: inline-block; width: 38px; height: 0; }
.score { text-align: left; }
.score-n { font: 600 40px/1 var(--font-mono); }
.score-n span { font-size: 16px; color: var(--muted); font-weight: 400; }
.comp { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.bar-f { height: 100%; background: var(--accent); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.kv .num { white-space: normal; text-align: right; }
.kv.bad .num { color: var(--bad); } .kv.warn .num { color: var(--warn); }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
#modal .box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; max-height: 90vh; }
#modal textarea { height: 46vh; }
@media (prefers-reduced-motion: no-preference) { .bar-f { transition: width 0.25s; } }
</style>

<header class="top">
  <a class="btn small-btn" href="/" title="Torna al portale">← Specchio Emergency Portal</a>
  <h1>ARALD Network Design Tool</h1>
  <span class="demo" title="Terreni sintetici e parametri radio non verificati">Esempio dimostrativo · non è una previsione</span>
  <span class="grow"></span>
  <label class="ctl" for="scenario">Rete <select id="scenario"></select></label>
  <label class="ctl" for="env">Ambiente
    <select id="env"><option value="favorevole">favorevole</option><option value="tipico">tipico</option><option value="severo">severo</option></select>
  </label>
  <label class="ctl" for="reg">Normativa
    <select id="reg"><option value="g1">EU868 g1 (1%)</option><option value="g3">EU868 g3 (10%)</option><option value="au915">AU915</option></select>
  </label>
  <button type="button" class="btn" id="cfg-open">Configurazione</button>
</header>

<div id="notice" role="status" hidden></div>

<div class="work">
  <section class="mapcol">
    <div class="toolbar">
      <div class="group" role="group" aria-label="Strumento">
        <span class="lbl">Strumento</span>
        <button type="button" class="btn" data-tool="select" aria-pressed="true">Seleziona</button>
        <button type="button" class="btn" data-tool="area" aria-pressed="false">Area di guasto</button>
      </div>
      <div class="group" id="area-wrap" hidden><label class="ctl" for="area-radius">Raggio <input type="range" id="area-radius" min="1" max="30" step="1" value="3"><span id="area-radius-v" class="mono">3 km</span></label></div>
      <div class="group" role="group" aria-label="Aggiungi un dispositivo" id="palette">
        <span class="lbl">Aggiungi</span>
      </div>
      <div class="group" role="group" aria-label="Modifiche">
        <button type="button" class="btn" id="undo" title="Annulla (Ctrl+Z)">Annulla</button>
        <button type="button" class="btn" id="redo" title="Ripeti (Ctrl+Maiusc+Z)">Ripeti</button>
      </div>
      <div class="group" role="group" aria-label="Alone di copertura">
        <span class="lbl">Alone</span>
        <button type="button" class="btn" data-halo="lora" aria-pressed="true">LoRa</button>
        <button type="button" class="btn" data-halo="ble" aria-pressed="false">BLE</button>
        <button type="button" class="btn" data-halo="wifi" aria-pressed="false">Wi-Fi</button>
        <button type="button" class="btn" data-halo="none" aria-pressed="false">Nessuno</button>
      </div>
      <button type="button" class="btn" id="fit">Inquadra</button>
      <div class="group" role="group" aria-label="Posizione sulla mappa">
        <span class="lbl">Vai a</span>
        <input type="text" id="goto" placeholder="lat, lon  (es. 46.5, 8.0)" aria-label="Coordinate: latitudine e longitudine" size="22" maxlength="60" autocomplete="off" spellcheck="false">
        <button type="button" class="btn" id="goto-go" title="Sposta la mappa a queste coordinate">Vai</button>
        <button type="button" class="btn" id="goto-new" title="Comincia una rete vuota con terreno reale in questo punto">Nuova rete qui</button>
        <button type="button" class="btn" id="recenter" hidden>Ricentra qui</button>
      </div>
    </div>
    <div id="goto-msg" class="hint" role="status"></div>
    <p id="far-note" class="warn-note" role="note" hidden></p>
    <div id="map-wrap"><canvas id="map" aria-label="Mappa della rete"></canvas><div id="tile-state" role="status" hidden></div><div id="attribution"></div></div>
    <div id="status-row"><div id="status" role="status"></div><div id="cursor-info" aria-hidden="true"></div></div>
  </section>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="rete" aria-selected="true">Rete</button>
      <button type="button" role="tab" data-tab="resilienza" aria-selected="false">Resilienza</button>
    </div>
    <div id="panel-body"></div>
  </aside>
</div>

<div id="modal" hidden>
  <div class="box" role="dialog" aria-label="Configurazione della rete">
    <strong>Configurazione della rete (JSON)</strong>
    <p class="hint">Copia il testo per salvarlo. Per riaprire una rete incollala qui, oppure scegli un file, e premi Applica.</p>
    <textarea id="cfg-text" spellcheck="false" aria-label="Configurazione JSON"></textarea>
    <div class="row wrap">
      <button type="button" class="btn" id="cfg-copy">Copia</button>
      <label class="btn" for="cfg-file">Apri file…</label>
      <input type="file" id="cfg-file" accept=".json,application/json" hidden>
      <button type="button" class="btn" id="cfg-apply" style="background:var(--accent);color:var(--accent-fg)">Applica</button>
      <button type="button" class="btn" id="cfg-close">Chiudi</button>
      <span id="cfg-msg" class="hint" role="status"></span>
    </div>
  </div>
</div>
